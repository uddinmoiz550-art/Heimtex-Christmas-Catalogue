<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas Collection 2026 – Lucky Textile Mills · Heimtextil</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0f2a20;--g2:#173d2e;--red:#9d1f2b;--gold:#d8b46a;--cream:#f7f0e2}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 800px at 50% -10%,#1d4a38,var(--g));color:var(--cream);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.screen{position:relative;z-index:2;min-height:100vh;padding:24px 18px;display:none}
.screen.on{display:block;animation:in .8s both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#intro{display:none;place-items:center;text-align:center}#intro.on{display:grid}
.logo{height:84px;border-radius:10px;background:#fff;padding:4px 10px;animation:pop 1s both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
h1{font:italic 600 clamp(2.6rem,10vw,5rem)/1 "Cormorant Garamond",Georgia,serif;margin:.4em 0 .1em;color:var(--gold);animation:in 1.2s .4s both;text-shadow:0 2px 20px #0008}
.sub{opacity:.85;animation:in 1.2s .8s both;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem}
.btn{font:600 1rem Inter,sans-serif;background:linear-gradient(135deg,#c0303d,var(--red));color:#fff;border:0;border-radius:99px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 24px #0006;transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn.gold{background:linear-gradient(135deg,#e8cd8c,var(--gold));color:#2a1d0a}
#form form{max-width:440px;margin:6vh auto 0;background:#fff1;backdrop-filter:blur(10px);border:1px solid #fff3;border-radius:22px;padding:28px;display:grid;gap:14px;text-align:left}
#form h2{font:italic 600 2.2rem "Cormorant Garamond",serif;margin:0;color:var(--gold);text-align:center}
label{font-size:.85rem;opacity:.9}input[type=text],input[type=email]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #fff4;background:#0006;color:#fff;font:inherit;margin-top:4px}
input:focus{outline:2px solid var(--gold)}
.chk{display:flex;gap:10px;font-size:.8rem;opacity:.9;align-items:flex-start}.hp{position:absolute;left:-9999px}
#err{color:#ffb3b3;font-size:.85rem;min-height:1.2em}
header.top{text-align:center;padding:30px 0 10px}
.design{max-width:1000px;margin:0 auto 70px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;opacity:0;transform:translateY(40px);transition:1s}
.design.show{opacity:1;transform:none}.design:nth-child(even) .mock{order:2}
@media(max-width:760px){.design{grid-template-columns:1fr}.design:nth-child(even) .mock{order:0}}
.mock{perspective:900px}.tilt{transition:transform .15s;transform-style:preserve-3d}
.bed{position:relative;aspect-ratio:4/5;background:#2b1d14;border-radius:16px;box-shadow:0 30px 50px #0008;overflow:hidden;border:6px solid #5a3d28}
.pil{position:absolute;top:5%;width:42%;height:17%;border-radius:12px;box-shadow:0 6px 12px #0005;background-size:90px}
.p1{left:5%}.p2{right:5%}
.duv{position:absolute;left:3%;right:3%;top:24%;bottom:-2%;border-radius:14px 14px 4px 4px;box-shadow:0 -4px 14px #0006;overflow:hidden}
.fold{position:absolute;left:0;right:0;top:0;height:14%;box-shadow:0 6px 12px #0005}
.duv::after,.pil::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#fff3,transparent 40%,#0003)}
.wm{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:.16;font:700 1rem Inter;transform:rotate(-25deg);pointer-events:none;letter-spacing:.3em;white-space:nowrap}
.code{display:inline-block;background:var(--red);padding:4px 14px;border-radius:99px;font-weight:600;letter-spacing:.1em;font-size:.85rem}
.design h3{font:italic 600 2.6rem/1.05 "Cormorant Garamond",serif;margin:.3em 0;color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid #fff4;border-radius:99px;padding:6px 14px;background:transparent;color:inherit;font:500 .85rem Inter;cursor:pointer}.chip.on{background:var(--gold);color:#2a1d0a;border-color:var(--gold)}
.sw{width:100%;max-width:230px;aspect-ratio:1;border-radius:14px;background-size:cover;cursor:zoom-in;border:3px solid #fff3;position:relative;overflow:hidden;transition:transform .3s}.sw:hover{transform:scale(1.04) rotate(-1deg)}
.pal{display:flex;gap:8px;margin:12px 0}.pal i{width:26px;height:26px;border-radius:50%;border:2px solid #fff6}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9;cursor:zoom-out}#lb.on{display:grid}
#lb div{width:min(92vw,80vh);aspect-ratio:1;background-size:200%;background-position:center;border-radius:14px;transition:background-position .1s}
footer{position:relative;z-index:2;text-align:center;font-size:.8rem;opacity:.7;padding:30px 18px 50px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.design{opacity:1;transform:none}}
</style></head><body>

const $=s=>document.querySelector(s),show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)};
let V=null;try{V=JSON.parse(localStorage.getItem('lt_v')||'null')}catch(e){}
function send(o){if(SCRIPT_URL.includes('PASTE'))return Promise.resolve();
 return fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).catch(()=>{})}
$('#go').onclick=()=>{V?open():show('#form')};
$('#f').onsubmit=async ev=>{ev.preventDefault();const n=$('#n').value.trim(),c=$('#c').value.trim(),e=$('#e').value.trim();
 if(n.length<2||c.length<2)return $('#err').textContent='Please enter your name and company.';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e))return $('#err').textContent='Please enter a valid email address.';
 if(!$('#ok').checked)return $('#err').textContent='Please tick the consent box to continue.';
 if($('#hp').value)return;
 V={n,c,e};try{localStorage.setItem('lt_v',JSON.stringify(V))}catch(x){}
 send({type:'Lead',name:n,company:c,email:e,design:''});open()};
function open(){$('#hi').textContent='Welcome, '+V.n;build();show('#cat');observe()}
function build(){const L=$('#list');if(L.children.length)return;
 D.forEach((d,i)=>{const el=document.createElement('article');el.className='design';
 el.innerHTML=`<div class="mock"><div class="tilt"><div class="bed">
  <div class="pil p1" style="background-image:url(${d.mock.f})"></div><div class="pil p2" style="background-image:url(${d.mock.f})"></div>
  <div class="duv" style="background-image:url(${d.mock.f});background-size:${d.mock.size}px"><div class="fold" style="background-image:url(${d.mock.fold});background-size:${d.mock.size}px"></div></div>
  <div class="wm">LUCKY TEXTILE</div></div></div>${d.room?`<img src="${d.room}" alt="${d.code} room" style="width:100%;border-radius:14px;margin-top:14px">`:''}</div>
 <div><span class="code">${d.code}</span><h3>${d.name}</h3><div>${d.type}</div><p style="opacity:.85">${d.info}</p>
 <div class="chips">${d.t.map((t,k)=>`<button class="chip ${k?'':'on'}" data-i="${k}">${t[0]}</button>`).join('')}</div>
 <div class="sw" style="background-image:url(${d.t[0][1]})" title="Tap to zoom"></div>
 <div class="pal">${d.pal.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div>
 <div class="row"><button class="btn enq">Enquire about this design</button></div></div>`;
 const sw=el.querySelector('.sw');
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{el.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');sw.style.backgroundImage=`url(${d.t[+b.dataset.i][1]})`});
 sw.onclick=()=>{const l=$('#lb');l.firstElementChild.style.backgroundImage=sw.style.backgroundImage;l.classList.add('on')};
 const eb=el.querySelector('.enq');eb.onclick=()=>{send({type:'Enquiry',name:V.n,company:V.c,email:V.e,design:d.code});eb.textContent='✓ Enquiry sent – we will contact you';eb.disabled=true};
 const t=el.querySelector('.tilt');const m=el.querySelector('.mock');
 m.onpointermove=ev=>{const r=m.getBoundingClientRect();t.style.transform=`rotateY(${((ev.clientX-r.left)/r.width-.5)*18}deg) rotateX(${-((ev.clientY-r.top)/r.height-.5)*14}deg)`};
 m.onpointerleave=()=>t.style.transform='';
 L.appendChild(el)})}
$('#lb').onclick=e=>e.currentTarget.classList.remove('on');
function observe(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('show');io.unobserve(x.target)}}),{threshold:.15});document.querySelectorAll('.design').forEach(d=>io.observe(d))}

const cv=$('#snow'),cx=cv.getContext('2d');let W,H,F=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const N=Math.min(70,Math.floor(innerWidth/14));for(let i=0;i<N;i++)F.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,s:.4+Math.random()*1.1,d:Math.random()*6});
(function loop(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(255,255,255,.8)';F.forEach(f=>{f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.5;if(f.y>H){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()});
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(loop)})();
</script></body></html>
